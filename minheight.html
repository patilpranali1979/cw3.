 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <style>
        body{
            background-color: red green blue;
        }
        .l1{
            display: block;
            font-size: 300px;
            text-align: center;
            margin-top: 120px;
        }
        .l2{
            display: none;
        }
        @media(min-height:500px){
            body{
                background: linear-gradient(to top, green , yellow,red)
            }
            .l1{
                display: none;
            }
            .l2{
                display: block;
                font-size: 300px;
                text-align: center;
                margin-top: 120px;
            }
        }
    </style>
 </head>
 <body>
    <section class="l1"><i class="fa-brands fa-instagram"></i></section>
    <section class="l2"><i class="fa-brands fa-linkedin"></i></section>
 </body>
 </html>
