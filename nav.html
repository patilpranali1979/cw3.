<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;

        }
        nav{
            background-color: aqua;
            height: 100px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;

        a{

            font-size: 20px;
        }
        @media(max-width:500px){
            body{
                background-color: white;
            }
            nav{
                background-color: black;
                height: auto;
                display: flex;
                flex-direction: column;
            }
            a{
                color:white;
                font-size: 20px;
                padding: 15px;
                width: 100%;
                text-align: center;
                border: solid white 3px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="">home</a>

    </nav>

</html>
